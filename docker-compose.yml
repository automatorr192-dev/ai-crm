services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Приложение стартует с миграций: без healthcheck они бьются в ещё не поднятую базу.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://crm:${POSTGRES_PASSWORD}@db:5432/crm
      # Сайт с формой при локальной сборке отдаётся своим сервером на 5500.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:5500,http://localhost:5500}
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
